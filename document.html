<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document View — Bastrop County Archive</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <style>

    .doc-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 2rem;
      padding: 2.5rem 0 4rem;
      align-items: start;
    }

    /* ── Doc title/author ── */
    .doc-title {
      font-family: var(--font-d);
      font-size: 1.9rem; font-weight: 700;
      color: var(--ink); line-height: 1.3;
      margin-bottom: .35rem;
    }
    .doc-author {
      font-size: 1rem; color: var(--muted);
      font-style: italic; margin-bottom: 1.5rem;
    }

    /* ── PDF area ── */
    .pdf-embed { width: 100%; height: 680px; border: none; display: block; }
    .pdf-placeholder {
      width: 100%; height: 680px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .75rem;
      background: repeating-linear-gradient(
        -45deg, rgba(0,0,0,.02) 0px, rgba(0,0,0,.02) 4px,
        transparent 4px, transparent 12px
      );
      border: 1.5px dashed var(--border);
      color: var(--muted); font-family: var(--font-m);
      font-size: .78rem; letter-spacing: .06em;
      text-align: center;
    }

    /* ── Sidebar ── */
    .doc-sidebar { display: flex; flex-direction: column; gap: .3rem; }

    /* ── Top action bar (cite + actions) ── */
    .sidebar-actions {
      display: flex; gap: .5rem; flex-wrap: wrap;
      margin-bottom: .75rem;
    }
    .sidebar-actions .btn { flex: 1; justify-content: center; font-size: .8rem; padding: .5rem .75rem; }

    /* ── Tags ── */
    .tag-list { display: flex; flex-wrap: wrap; gap: .4rem; }
    .sidebar-tags {
      background: var(--paper); border: 1px solid var(--border);
      padding: .85rem 1.1rem; margin-bottom: .3rem;
    }
    .sidebar-tags__label {
      font-family: var(--font-m); font-size: .7rem;
      letter-spacing: .04em;
      color: var(--muted); margin-bottom: .55rem; display: block;
    }

    /* ── Accordion ── */
    .accordion { border: 1px solid var(--border); background: var(--paper); }
    .accordion + .accordion { border-top: none; }
    .accordion__trigger {
      width: 100%; display: flex; align-items: center;
      justify-content: space-between;
      padding: .75rem 1.1rem;
      background: none; border: none; cursor: pointer;
      font-family: var(--font-m); font-size: .72rem;
      letter-spacing: .04em;
      color: var(--ink-soft); text-align: left;
      transition: background .15s;
    }
    .accordion__trigger:hover { background: var(--sand); }
    .accordion__arrow {
      font-size: .6rem; color: var(--muted);
      transition: transform .2s ease; flex-shrink: 0;
    }
    .accordion.open .accordion__arrow { transform: rotate(180deg); }
    .accordion__body {
      display: none;
      border-top: 1px solid var(--border);
      padding: 1rem 1.1rem;
    }
    .accordion.open .accordion__body { display: block; }

    /* ── Detail table ── */
    .detail-table { width: 100%; border-collapse: collapse; font-size: .84rem; color: var(--ink-soft); }
    .detail-table td { padding: .5rem .6rem; }
    .detail-table tr { border-bottom: 1px solid var(--border); }
    .detail-table tr:last-child { border-bottom: none; }
    .detail-table .label {
      font-family: var(--font-m); font-size: .68rem;
      letter-spacing: .04em;
      color: var(--muted); width: 38%;
    }

    /* ── Access notices ── */
    .access-notice {
      display: flex; gap: .85rem; padding: 1rem 0;
      font-size: .87rem; color: var(--ink-soft); line-height: 1.6;
    }
    .excerpt-text {
      font-size: .92rem; color: var(--ink-soft); line-height: 1.8;
      border-left: 3px solid var(--rust); padding-left: 1.1rem; font-style: italic;
    }

    /* ── Citation modal ── */
    .cite-backdrop {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(28,20,16,.55); backdrop-filter: blur(3px);
      align-items: center; justify-content: center;
    }
    .cite-backdrop.open { display: flex; }

    .cite-modal {
      background: var(--paper);
      border: 1px solid var(--border);
      border-top: 3px solid var(--rust);
      width: 100%; max-width: 560px;
      margin: 1.5rem;
      box-shadow: 0 20px 60px rgba(28,20,16,.25);
      animation: modalIn .2s ease;
    }
    @keyframes modalIn {
      from { opacity:0; transform:translateY(-10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .cite-modal__header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--sand);
    }
    .cite-modal__header h3 {
      font-family: var(--font-m); font-size: .72rem;
      letter-spacing: .04em; color: var(--ink-soft);
    }
    .cite-modal__close {
      background: none; border: none; cursor: pointer;
      font-size: 1.1rem; color: var(--muted); transition: color .15s; line-height:1;
    }
    .cite-modal__close:hover { color: var(--rust); }
    .cite-modal__body { padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    .cite-modal__doc-title {
      font-family: var(--font-d); font-size: 1rem; font-weight: 600;
      color: var(--ink); padding-bottom: .75rem; border-bottom: 1px solid var(--border);
    }

    /* Each citation row */
    .cite-row { display: flex; flex-direction: column; gap: .4rem; }
    .cite-row__label {
      font-family: var(--font-m); font-size: .68rem;
      letter-spacing: .04em; color: var(--muted);
    }
    .cite-row__text {
      font-family: var(--font-m); font-size: .78rem; line-height: 1.65;
      color: var(--ink-soft); background: var(--cream);
      padding: .65rem .75rem; border: 1px solid var(--border);
      user-select: all; flex: 1;
    }
    .cite-row__inner { display: flex; gap: .5rem; align-items: stretch; }
    .cite-copy {
      font-family: var(--font-b); font-size: .75rem; font-weight: 600;
      padding: 0 .85rem; cursor: pointer; white-space: nowrap;
      background: transparent; border: 1.5px solid var(--border);
      color: var(--ink-soft); transition: all .18s; border-radius: 2px; flex-shrink: 0;
    }
    .cite-copy:hover { background: var(--rust); color: var(--white); border-color: var(--rust); }
    .cite-copy.copied { background: #1a5c2a; color: var(--white); border-color: #1a5c2a; }

    @media (max-width: 900px) { .doc-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<script src="config.js"></script>
<script src="cite.js"></script>
<script src="shell.js"></script>

<main>

  <div class="page-hero">
    <div class="container">
      <a href="archive.html" style="font-family:var(--font-m); font-size:.72rem; letter-spacing:.04em; color:#9a8e86;">← Back to Archive</a>
      <p style="color:#9a8e86; font-size:.88rem; margin-top:.25rem;">Document View</p>
    </div>
  </div>

  <div class="container">

    <p id="docLoading" style="padding:3rem 0;color:var(--muted);">Loading document…</p>

    <div id="docError" role="alert" style="display:none;padding:1.25rem;margin:2rem 0;
         border:1px solid var(--border);border-left:3px solid var(--rust);background:var(--sand);">
      <strong style="display:block;margin-bottom:.35rem;color:var(--ink);">Could not load this document</strong>
      <span id="docErrorDetail" style="color:var(--ink-soft);font-size:.88rem;"></span>
      <div style="margin-top:.75rem;">
        <a href="archive.html" class="btn btn--outline btn--sm">Back to Archive</a>
      </div>
    </div>

    <!-- Filled by renderDocument() from the record's Dublin Core fields. -->
    <div class="doc-layout" id="docLayout" style="display:none;">

      <div>
        <h1 class="doc-title" id="docTitle"></h1>
        <p class="doc-author" id="docAuthor"></p>

        <div class="accordion open" id="acc-abstract" style="margin-bottom:1.25rem;">
          <button class="accordion__trigger" onclick="toggleAcc('acc-abstract')">
            Abstract <span class="accordion__arrow">&#9660;</span>
          </button>
          <div class="accordion__body">
            <p id="docAbstract" style="font-size:.92rem; color:var(--ink-soft); line-height:1.8;"></p>
          </div>
        </div>

        <!-- Access block: PDF embed, external-source notice, or metadata-only
             notice, decided by accessClass(). -->
        <div id="docAccess"></div>
      </div>

      <aside class="doc-sidebar">

        <div class="sidebar-actions" id="docActions"></div>

        <div class="sidebar-tags" id="docTagsWrap" style="display:none;">
          <span class="sidebar-tags__label">Subjects</span>
          <div class="tag-list" id="docTags"></div>
        </div>

        <div>
          <div class="accordion open" id="acc-info">
            <button class="accordion__trigger" onclick="toggleAcc('acc-info')">
              Info <span class="accordion__arrow">&#9660;</span>
            </button>
            <div class="accordion__body" style="padding:0;">
              <table class="detail-table" id="docInfo"></table>
            </div>
          </div>

          <div class="accordion" id="acc-terms">
            <button class="accordion__trigger" onclick="toggleAcc('acc-terms')">
              Terms of Use &amp; Copyright <span class="accordion__arrow">&#9660;</span>
            </button>
            <div class="accordion__body">
              <p id="docRights" style="font-size:.85rem; color:var(--ink-soft); line-height:1.75;"></p>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

</main>


<!-- ── CITATION MODAL ── -->
<div class="cite-backdrop" id="citeBackdrop" onclick="closeCiteOnBackdrop(event)">
  <div class="cite-modal">
    <div class="cite-modal__header">
      <h3>Cite this document</h3>
      <button class="cite-modal__close" onclick="closeCiteModal()">✕</button>
    </div>
    <div class="cite-modal__body">

      <p class="cite-modal__doc-title" id="citeTitle"></p>

      <div class="cite-row">
        <span class="cite-row__label">MLA</span>
        <div class="cite-row__inner">
          <div class="cite-row__text" id="cite-mla"></div>
          <button class="cite-copy" onclick="copyCite('cite-mla', this)">Copy</button>
        </div>
      </div>

      <div class="cite-row">
        <span class="cite-row__label">APA</span>
        <div class="cite-row__inner">
          <div class="cite-row__text" id="cite-apa"></div>
          <button class="cite-copy" onclick="copyCite('cite-apa', this)">Copy</button>
        </div>
      </div>

      <div class="cite-row">
        <span class="cite-row__label">Chicago</span>
        <div class="cite-row__inner">
          <div class="cite-row__text" id="cite-chicago"></div>
          <button class="cite-copy" onclick="copyCite('cite-chicago', this)">Copy</button>
        </div>
      </div>

      <div class="cite-row">
        <span class="cite-row__label">Harvard</span>
        <div class="cite-row__inner">
          <div class="cite-row__text" id="cite-harvard"></div>
          <button class="cite-copy" onclick="copyCite('cite-harvard', this)">Copy</button>
        </div>
      </div>

    </div>
  </div>
</div>


<script>
// ──────────────────────────────────────────────────────────────────────────
// Data layer — one document, from GET /documents
//
// The API has no per-document route (GET /documents/<id> is a 404), so the
// page fetches the collection and picks out the id from the query string.
// Swap fetchDocument() for a direct call once that route exists.
//
// Every field below is Dublin Core as stored on the record. Fields are rendered
// only when the record actually carries them: archival metadata is uneven, and
// a row reading "Unknown" is worse than no row.
// ──────────────────────────────────────────────────────────────────────────

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
));

/** DC fields are sometimes a list, sometimes a scalar, sometimes absent. */
const asList = (v) => (Array.isArray(v) ? v : [v])
  .map(x => String(x ?? '').trim())
  .filter(Boolean);

const asText = (v) => String(v ?? '').trim();

/** ISO 639-2 codes as stored in dcLanguage. Unknown codes show as given. */
const LANGUAGES = {
  eng: 'English', spa: 'Spanish', fra: 'French', fre: 'French', deu: 'German',
  ger: 'German', por: 'Portuguese', ita: 'Italian', lat: 'Latin', rus: 'Russian',
  ara: 'Arabic', zho: 'Chinese', chi: 'Chinese', nav: 'Navajo', und: 'Undetermined',
};
const languageName = (code) => LANGUAGES[code.toLowerCase()] ?? code;

/**
 * rightsstatements.org URIs, as dcRights sometimes holds one of these rather
 * than a phrase. Only the statement's short label is mapped; the long prose
 * lives in rightsProse().
 */
const RIGHTS_LABELS = {
  'InC':        'In Copyright',
  'InC-EDU':    'In Copyright — Educational Use Permitted',
  'InC-NC':     'In Copyright — Non-Commercial Use Permitted',
  'InC-OW-EU':  'In Copyright — EU Orphan Work',
  'NoC-US':     'No Copyright — United States',
  'NoC-OKLR':   'No Copyright — Other Known Legal Restrictions',
  'NKC':        'Copyright Not Evaluated',
  'UND':        'Copyright Undetermined',
  'CNE':        'Copyright Not Evaluated',
};

/** Split a rightsstatements.org URI down to its vocabulary code. */
function rightsCode(rights) {
  const m = /rightsstatements\.org\/vocab\/([A-Za-z-]+)/.exec(rights);
  return m ? m[1] : null;
}

/** Short label for the Info table. */
function rightsLabel(rights) {
  const code = rightsCode(rights);
  if (code) return RIGHTS_LABELS[code] ?? code;
  return rights;
}

/** Is this item free of copyright restriction, as far as dcRights says? */
function isOpen(rights) {
  const code = rightsCode(rights);
  if (code) return code.startsWith('NoC');
  return /public domain|no known copyright|cc0/i.test(rights);
}

/** The prose shown under Terms of Use, keyed off dcRights. */
function rightsProse(d) {
  if (!d.rights) {
    return 'The rights status of this item has not been recorded. Contact the archive '
         + 'before reproducing it.';
  }
  if (isOpen(d.rights)) {
    return `This item is in the <strong>public domain</strong> or free of known copyright `
         + `restriction (${esc(rightsLabel(d.rights))}). It may be accessed, reproduced, and `
         + `shared freely. Please credit the Bastrop County Archive when citing it.`;
  }
  const where = d.source ? ` The item is held by ${esc(d.source)}.` : '';
  return `This item is <strong>under copyright</strong> (${esc(rightsLabel(d.rights))}). `
       + `It may be searched and referenced here, but the full text cannot be downloaded `
       + `or reproduced from this archive.${where} To consult the full text, contact the `
       + `rights holder or the holding institution.`;
}

/** Normalise one API record into the shape this page renders. */
function normalizeDocument(it) {
  const identifiers = asText(it.dcIdentifier)
    .split(';')
    .map(x => x.trim())
    .filter(Boolean);

  return {
    documentId:  asText(it.documentId),
    title:       asText(it.dcTitle) || '(untitled)',
    creators:    asList(it.dcCreator),
    contributors: asList(it.dcContributor),
    description: asText(it.dcDescription),
    date:        asText(it.dcDate) || asText(it.dateDisplay),
    temporal:    asText(it.dcCoverageTemporal),
    places:      asList(it.dcCoverageSpatial),
    languages:   asList(it.dcLanguage).map(languageName),
    publisher:   asText(it.dcPublisher),
    format:      asText(it.dcFormat),
    type:        asText(it.dcType),
    source:      asText(it.dcSource),
    subjects:    asList(it.dcSubject),
    relations:   asList(it.dcRelation),
    rights:      asText(it.dcRights),
    identifiers,
    // dcIdentifier doubles as a link when it holds a URL rather than an ISBN
    // or call number, which is the only external target the record offers.
    sourceUrl:   identifiers.find(x => /^https?:\/\//i.test(x)) ?? null,
    // archivePdfUrl() (config.js) resolves the scan under
    // archival-documents/<documentId>/pdf/ and serves it through CloudFront.
    // Null means the archive holds no file for this record, which is the
    // normal case while the collection is still being uploaded.
    pdfUrl:      archivePdfUrl(it),
    datasetUrl:  archiveDatasetUrl(it),
    rowCount:    Number(it.rowCount) || 0,
    sheetCount:  Number(it.sheetCount) || 0,
    pageCount:   Number(it.pageCount) > 0 ? Number(it.pageCount) : null,
  };
}

/**
 * Which of the three access presentations this document gets.
 *   A: the file is viewable here, so embed it and offer a download.
 *   B: not viewable, but the record points somewhere that holds it.
 *   C: metadata only.
 */
function accessClass(d) {
  // D before A: a dataset record is downloaded, not read in a viewer. The
  // browser has no spreadsheet renderer, so embedding one would show a download
  // prompt inside an iframe, which reads as a broken page.
  if (d.datasetUrl) return 'D';
  if (d.pdfUrl) return 'A';
  if (d.sourceUrl) return 'B';
  return 'C';
}

/** "13,035 rows across 14 sheets", or as much of it as the record knows. */
function extentProse(d) {
  const parts = [];
  if (d.rowCount) parts.push(`${d.rowCount.toLocaleString()} rows`);
  if (d.sheetCount) parts.push(`${d.sheetCount} sheet${d.sheetCount === 1 ? '' : 's'}`);
  return parts.join(' across ');
}

/** One row of the Info table, or nothing when the field is absent. */
function row(label, html) {
  return html ? `<tr><td class="label">${esc(label)}</td><td>${html}</td></tr>` : '';
}

const plain = (v) => v ? esc(v) : '';
const list  = (arr) => arr.length ? arr.map(esc).join('<br>') : '';

let currentDoc = null;

function renderDocument(d) {
  currentDoc = d;
  document.title = `${d.title} — Bastrop County Archive`;

  document.getElementById('docTitle').textContent = d.title;
  document.getElementById('docAuthor').textContent = d.creators.join('; ');
  document.getElementById('docAuthor').style.display = d.creators.length ? '' : 'none';

  // Abstract: hide the whole accordion rather than show an empty panel.
  const abstract = document.getElementById('acc-abstract');
  if (d.description) {
    document.getElementById('docAbstract').textContent = d.description;
  } else {
    abstract.style.display = 'none';
  }

  renderAccess(d);
  renderActions(d);

  const tags = d.subjects.map(s => `<span class="tag">${esc(s)}</span>`).join('');
  document.getElementById('docTags').innerHTML = tags;
  document.getElementById('docTagsWrap').style.display = tags ? '' : 'none';

  const ids = d.identifiers.map(x => /^https?:\/\//i.test(x)
    ? `<a href="${esc(x)}" target="_blank" rel="noopener noreferrer">${esc(x)}</a>`
    : esc(x)).join('<br>');

  document.getElementById('docInfo').innerHTML = [
    row('Date', plain(d.date)),
    row('Period', plain(d.temporal)),
    row('Type', plain(d.type)),
    row('Format', plain(d.format)),
    row('Pages', d.pageCount ? esc(String(d.pageCount)) : ''),
    row('Publisher', plain(d.publisher)),
    row('Place', list(d.places)),
    row('Language', list(d.languages)),
    row('Contributors', list(d.contributors)),
    row('Collection', plain(d.source)),
    row('Rights', plain(rightsLabel(d.rights))),
    row('Related', list(d.relations)),
    row(d.identifiers.length > 1 ? 'Identifiers' : 'Identifier', ids),
  ].join('');

  document.getElementById('docRights').innerHTML = rightsProse(d);

  document.getElementById('docLoading').style.display = 'none';
  document.getElementById('docLayout').style.display = '';
}

function renderAccess(d) {
  // The viewer's own page controls sit bottom-right, where the chat bubble
  // lives. This class lifts the bubble clear of them; see .has-pdf in style.css.
  document.body.classList.toggle('has-pdf', accessClass(d) === 'A');

  const where = d.sourceUrl
    ? `<a href="${esc(d.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(d.source || d.sourceUrl)}</a>`
    : esc(d.source || 'the holding institution');

  const blocks = {
    // #view=FitH opens at page width. Scans run to tens of megabytes; the
    // distribution answers range requests, so the built-in viewer streams the
    // file a page at a time instead of waiting for the whole download.
    A: `<iframe class="pdf-embed" src="${esc(d.pdfUrl)}#view=FitH"
                title="${esc(d.title)}" loading="lazy"></iframe>`,
    B: `<div class="access-notice">
          <div>The full text is not available for display here. It can be consulted at
          ${where}.</div>
        </div>`,
    C: `<div class="access-notice">
          <div>This record is metadata only: the text cannot be displayed or downloaded
          from the archive. To consult the item, contact ${where}.</div>
        </div>`,
    D: `<div class="access-notice">
          <div>This is a tabular dataset${extentProse(d) ? ` of ${extentProse(d)}` : ''},
          available as a spreadsheet download. Open it in Excel, Numbers, R, or
          Python; the sheets are listed in the description above.</div>
        </div>`,
  };
  document.getElementById('docAccess').innerHTML = blocks[accessClass(d)];
}

function renderActions(d) {
  const cite = `<button class="btn btn--outline" onclick="citeDocument()" title="Cite this document">
      <span class="material-icons" style="font-size:1.1rem;">format_quote</span> Cite
    </button>`;

  const extra = {
    A: `<a href="${esc(d.pdfUrl)}" download class="btn btn--primary" title="Download PDF">
          <span class="material-icons" style="font-size:1.1rem;">download</span> Download
        </a>
        <a href="${esc(d.pdfUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn--ghost" title="Open in new tab">
          <span class="material-icons" style="font-size:1.1rem;">open_in_new</span>
        </a>`,
    B: `<a href="${esc(d.sourceUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn--outline" title="View at external source">
          <span class="material-icons" style="font-size:1.1rem;">open_in_new</span> View source
        </a>`,
    D: `<a href="${esc(d.datasetUrl)}" download class="btn btn--primary" title="Download the dataset">
          <span class="material-icons" style="font-size:1.1rem;">download</span> Download spreadsheet
        </a>`,
    C: '',
  };
  document.getElementById('docActions').innerHTML = cite + extra[accessClass(d)];
}

/**
 * Cite the document on screen. citations() lives in cite.js and is shared with
 * the archive list, so both places render the same four styles.
 */
function citeDocument() {
  if (!currentDoc) return;
  openCiteModal({
    title:     currentDoc.title,
    creators:  currentDoc.creators,
    publisher: currentDoc.publisher,
    date:      currentDoc.date,
  });
}

function showDocError(message) {
  document.getElementById('docLoading').style.display = 'none';
  document.getElementById('docLayout').style.display = 'none';
  document.getElementById('docErrorDetail').textContent = message;
  document.getElementById('docError').style.display = '';
}

async function loadDocument() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) {
    showDocError('No document id in the address. Open a document from the archive listing.');
    return;
  }

  try {
    // No custom headers: this stays a CORS "simple request", so the browser
    // never needs to send an OPTIONS preflight.
    const res = await fetch(`${API_BASE_URL}/documents`);
    if (!res.ok) throw new Error(`The archive API returned HTTP ${res.status} ${res.statusText}.`);
    const body = await res.json();
    const raw = Array.isArray(body) ? body : (body.items ?? []);
    if (!Array.isArray(raw)) throw new Error('The archive API returned an unexpected response shape.');

    const match = raw.find(it => String(it.documentId ?? '') === id);
    if (!match) {
      showDocError(`No document in the archive has the id "${id}".`);
      return;
    }
    renderDocument(normalizeDocument(match));
  } catch (err) {
    console.error('GET /documents failed:', err);
    showDocError(err instanceof TypeError
      ? 'Could not reach the archive API. Check your connection and that the API allows this origin.'
      : err.message);
  }
}

loadDocument();
</script>

function toggleAcc(id) {
  document.getElementById(id).classList.toggle('open');
}
</script>
